AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Creates Lambda@Edge functions and SSL certificate

Metadata:
  AWS::ServerlessRepo::Application:
    Name: Atom-Auth-at-Edge
    Description: OAuth2 authorisation code flow running on the edge (via cloudfront and Lambda@edge)
    Author: ada
    SpdxLicenseId: Apache-2.0
    ReadmeUrl: README.md
    LicenseUrl: LICENSE
    Labels: ["oauth2"]
    HomePageUrl: https://github.com/Ada-Mode-Atom/Atom-Auth-at-Edge-App
    SemanticVersion: 2.0.0
    SourceCodeUrl: https://github.com/Ada-Mode-Atom/Atom-Auth-at-Edge-App

Parameters:
  StackName:
    Type: String
    Description: The application that owns this setup and parameter namespace.
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "Only letters, numbers, hyphens, and underscores are allowed (no spaces or special characters)."

  DiscoveryDocument:
    Type: String
    Description: Oauth2 openid discovery document endpoints such as `https://login.microsoftonline.com/<TENANT_ID>/v2.0/.well-known/openid-configuration`

  Oauth2RedirectPath:
    Type: String
    Default: /auth/callback
    Description: Oauth2 registered redirect path

  ClientId:
    Type: String
    Description: Oauth2 Client Id configured with the provided redirect url and hosted UI

  Scope:
    Type: String
    Description: OpenID Connect scopes requested from Microsoft Entra
    Default: openid profile email

  ClientSecret:
    Type: String
    NoEcho: true
    Description: Microsoft Entra application client secret

  PublicUrl:
    Type: String
    Description: Public URL of the CloudFront site, without trailing slash

  SessionSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign authentication session cookies

Globals:
  Function:
    Timeout: 20
    MemorySize: 128
    Runtime: python3.12

Resources:
  DiscoveryParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/config
      Type: String
      Value: !Ref DiscoveryDocument
      Description: SSM Parameter for the Oauth2 Discover Document path

  DomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/redirect
      Type: String
      Value: !Ref Oauth2RedirectPath
      Description: SSM Parameter for the registered Oauth2 Redirect Path

  ClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/client_id
      Type: String
      Value: !Ref ClientId
      Description: SSM Parameter for the Oauth2 Client Id

  ScopeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/scope
      Type: String
      Value: !Ref Scope
      Description: SSM Parameter for the Oauth2 Scopes

  ClientSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/client_secret
      Type: String
      Value: !Ref ClientSecret
      Description: Microsoft Entra client secret

  PublicUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/public_url
      Type: String
      Value: !Ref PublicUrl
      Description: Public URL of the documentation site

  SessionSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackName}/auth/session_secret
      Type: String
      Value: !Ref SessionSecret
      Description: Session cookie signing secret

  CallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub auth-callback-${StackName}
      AutoPublishAlias: live
      CodeUri: ./app/auth
      Handler: main.callback_handler
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - Version: "2012-10-17"
          Statement:
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Effect: Allow
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackName}/auth/*
        - Version: "2012-10-17"
          Statement:
            Action:
              - lambda:GetFunction
            Effect: Allow
            Resource: "*"

  AuthorizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub auth-handler-${StackName}
      AutoPublishAlias: live
      CodeUri: ./app/auth
      Handler: main.auth_handler
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - Version: "2012-10-17"
          Statement:
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Effect: Allow
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackName}/auth/*
        - Version: "2012-10-17"
          Statement:
            Action:
              - lambda:GetFunction
            Effect: Allow
            Resource: "*"

  ReWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rewrite-index-handler-${StackName}
      AutoPublishAlias: live
      CodeUri: ./app/rewrite
      Handler: main.handler
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - Version: "2012-10-17"
          Statement:
            Action:
              - lambda:GetFunction
            Effect: Allow
            Resource: "*"

Outputs:
  AuthHandler:
    Value: !GetAtt AuthorizeFunction.Arn
    Description: The auth handler ARN (use the latest version)
  CallbackHandler:
    Value: !GetAtt CallbackFunction.Arn
    Description: The callback handler ARN (use the latest version)
  ReWriteHandler:
    Value: !GetAtt ReWriteFunction.Arn
    Description: An index.html rewrite handler ARN (use the latest version)
